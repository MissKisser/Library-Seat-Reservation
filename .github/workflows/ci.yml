name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 防回归门禁需要扫描完整 git 历史；浅克隆会让历史检查失去意义。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Lint (full rule set)
        run: ruff check seatbot tests

      - name: Smoke config (empty accounts, isolated DB)
        run: |
          cat > config.test.yaml <<'YAML'
          library:
            room_id: 10000
            room_name: "smoke"
            open_time: "08:00"
            close_time: "22:00"
            max_reserve_hours: 2.0
          runtime:
            db_path: ".tmp_pytest/ci-smoke.db"
            web_host: "127.0.0.1"
            web_port: 8765
            web_token: "ci-token"
          target_seats: []
          accounts: []
          user_reserved: []
          YAML

      - name: Unit tests
        env:
          PYTEST_ADDOPTS: "-o faulthandler_timeout=120"
        run: python -m pytest -m "not integration" -q

      - name: Guard (regression gate)
        env:
          # CI 内没有生产库，用隔离空库驱动门禁：与真实凭证/真实实例的比对项自然为空，
          # 手机号形态、cookie 形态、脱敏标记、历史痕迹等正则类检查照常生效。
          SEATBOT_GUARD_DB_PATH: "${{ runner.temp }}/guard-isolated.db"
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = os.environ["SEATBOT_GUARD_DB_PATH"]
          connection = sqlite3.connect(path)
          connection.execute("create table if not exists accounts (id text primary key, phone text, password text)")
          connection.execute("create table if not exists target_seats (seat_num text primary key, label text)")
          connection.execute("create table if not exists account_cookies (account_id text primary key, cookies_json text)")
          connection.commit()
          connection.close()
          PY
          python scripts/guard/guard.py
