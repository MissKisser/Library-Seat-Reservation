# Library Seat Reservation Bot — 多目标座位 + 时段满约 (v2)
#
# 用法: cp config.example.yaml config.yaml → 填入真实账号/座位 →
#       python -m seatbot init-db → python -m seatbot run
#
# ⚠️ 本文件是模板,全部凭证均为占位符。不要把真实密码写进本文件或提交 git。
#
# 核心概念 (v2):
#   ★ target_seats: N 个想保护的目标座位
#   ★ accounts: M 个守护账号, 推荐用 seat_slots 精确指定 (座位, 时段) 组合
#   ★ 单段 ≤ max_reserve_hours (超长 range 会被 planner 拒绝, 不自动拆段)

library:
  room_id: 11692                          # 超星房间 ID (抓包获得)
  room_name: "2号楼图书馆-3F-3楼备考自习室"
  open_time: "08:00"
  close_time: "22:00"
  max_reserve_hours: 2.0                  # 超星硬约束: 单次预约 ≤ 2h

# 目标座位 — Web 面板 (/targets) 是主入口, 这里只是 seed
target_seats:
  - seat_num: "104"
    label: "目标座位A (示例)"
  - seat_num: "105"
    label: "目标座位B (示例)"

# 守护账号 (M 个)
#
# ★ 推荐写法: seat_slots 精确矩阵 —
#     每个账号对每个座位守哪些时段一目了然, planner 按 (seat, slot) 精确展开。
#     下例即 "3 账号 × 2 座位 × 3 时段" 守护矩阵, 每天恰好 6 段。
#
#   seat_slots:
#     "104": ["09:00-11:00"]        # 该账号在 104 守 09-11
#     "105": ["15:00-17:00"]        # 该账号在 105 守 15-17
#
# ⚠️ 不推荐: 扁平 slots + bound_seats 会做笛卡尔积 (每座位都约全部时段),
#    实测一天会生成 16-22 段, 违反 "6 段精确" 目标。
#    slots: "full" / ["HH:MM-HH:MM"] 仅作为兜底语义保留。
accounts:
  - id: guard_a                           # 账号别名 (唯一)
    phone: "138xxxxxxxx"                  # ← 真实手机号
    password: "your-password-here"        # ← 真实密码
    seat_slots:
      "104": ["09:00-11:00"]
      "105": ["15:00-17:00"]

  - id: guard_b
    phone: "139xxxxxxxx"
    password: "your-password-here"
    seat_slots:
      "104": ["15:00-17:00"]
      "105": ["19:00-21:00"]

  - id: guard_c
    phone: "137xxxxxxxx"
    password: "your-password-here"
    seat_slots:
      "104": ["19:00-21:00"]
      "105": ["09:00-11:00"]

# ★ 用户硬预约段 (你本人在超星 App 手动约过的段, scheduler 生成任务时跳过,
#   避免重复预约/覆盖)。日期是具体某一天, 过期后可删除。
user_reserved: []
  # - account_id: guard_a
  #   seat_num: "104"
  #   day: "2026-08-26"
  #   start_time: "19:30"
  #   end_time: "21:30"
  #   note: "本人已手动预约, scheduler 跳过"

runtime:
  stagger_seconds: [0, 3]                 # 各账号每分钟 tick 的错峰秒数
  direct_submit_enabled: true             # 跨天预约直连通道开关 (关=未来日期任务直接 FAILED, 不误约当天)
  notify_webhook: ""                      # 告警外推 (bark/Server酱/企微 webhook URL); 空=只落看板 banner
  log_dir: ./logs
  db_path: ./seatbot.db
  web_host: 127.0.0.1                     # 默认仅本机访问; 局域网访问改 0.0.0.0 并务必设置 web_token
  web_port: 8080
  web_token: ""                           # 面板令牌; 非空时所有请求需携带 (header/query/cookie)
