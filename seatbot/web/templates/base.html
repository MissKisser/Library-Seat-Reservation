<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SeatBot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>[x-cloak]{display:none!important}</style>
  {% block head_extra %}{% endblock %}
  {# app.js 必须先于 alpinejs 加载 (两者都用 defer,按文档序执行)。
     Alpine 3 CDN bundle 在脚本执行时立即扫描 x-data 指令;
     若 alpinejs 先执行,会找到 x-data="seatMap(11692)" 这类表达式,
     但此时 window.seatMap 还没注册 (app.js 还没跑),表达式求值失败,
     控制台会刷一堆 "X is not defined" 警告,且组件 data stack 为空,
     导致 <template x-for> 永远不渲染 (e.g. 座位图加载不出来)。 #}
  <script defer src="/static/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  {% from "_macros/shell.html" import shell %}
  {% set _page_title = self.title() if self.title is defined else '' %}
  {% set _page_title = _page_title|trim %}
  {% call shell(active=active_page or 'dashboard',
               title=_page_title,
               target_seats=(target_seats if target_seats is defined else []),
               accounts_count=(accounts|length if accounts is defined else 0)) %}
    {% block content %}{% endblock %}
  {% endcall %}
  {% block scripts %}{% endblock %}
</body>
</html>
