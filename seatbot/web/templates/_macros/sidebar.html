{# Macro: sidebar. Renders the left navigation with 7 items, theme toggle, and version footer. #}
{% macro sidebar(active='', target_seat_num=0, accounts_count=0) %}
<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark">📚</span>
    <span class="brand-name">SeatBot</span>
  </div>
  <nav class="sidebar-nav">
    <a class="sidebar-link {% if active == 'dashboard' %}active{% endif %}" href="/">
      <span class="label">覆盖图</span>
    </a>
    <a class="sidebar-link {% if active == 'seat-config' %}active{% endif %}" href="/seat-config">
      <span class="label">目标座位</span>
      <span class="count">{{ target_seat_num }}</span>
    </a>
    <a class="sidebar-link {% if active == 'accounts' %}active{% endif %}" href="/accounts">
      <span class="label">守护账号</span>
      <span class="count">{{ accounts_count }}</span>
    </a>
    <a class="sidebar-link {% if active == 'coverage' %}active{% endif %}" href="/coverage">
      <span class="label">覆盖报告</span>
    </a>
    <a class="sidebar-link {% if active == 'tasks' %}active{% endif %}" href="/tasks">
      <span class="label">任务</span>
    </a>
    <a class="sidebar-link {% if active == 'seats' %}active{% endif %}" href="/seats">
      <span class="label">座位图</span>
    </a>
    <a class="sidebar-link {% if active == 'logs' %}active{% endif %}" href="/logs">
      <span class="label">日志</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" type="button" aria-label="切换主题">
      <span class="theme-icon-dark">暗</span>
      <span class="theme-icon-light">亮</span>
    </button>
    <div class="sidebar-version">v0.4.2 · 本地/内网</div>
  </div>
</aside>
{% endmacro %}
