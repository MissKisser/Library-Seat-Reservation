{# Macro: stat_card. Renders a single stat card with label, value, optional hint, and accent flag. #}
{% macro stat_card(label='', value='', hint=None, accent=False) %}
<div class="stat-card">
  <div class="stat-label">{{ label }}</div>
  <div class="stat-value {% if accent %}accent{% endif %}">{{ value }}</div>
  {% if hint %}<div class="stat-hint">{{ hint }}</div>{% endif %}
</div>
{% endmacro %}
