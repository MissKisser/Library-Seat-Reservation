{% extends "base.html" %}
{% block title %}任务{% endblock %}

{% block content %}
<div class="flex flex-col gap-5" x-data='tasksBoard({{ tasks_initial|tojson }})'>
  <div class="page-header">
    <div>
      <h1 class="page-title">任务看板</h1>
      <p class="page-sub">按状态分列 · 失败卡可直接重试</p>
    </div>
    <div class="flex items-center gap-2">
      <a class="btn btn-secondary btn-sm" href="/tasks?day={{ prev_day }}">← 前一天</a>
      <span class="chip chip-accent font-mono" x-text="day"></span>
      <a class="btn btn-secondary btn-sm" href="/tasks?day={{ next_day }}">后一天 →</a>
      <button class="btn btn-secondary btn-sm" type="button" @click="refresh()" :disabled="loading"
              x-text="loading ? '刷新中…' : '刷新'"></button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 items-start">
    <template x-for="col in columns" :key="col.key">
      <div class="flex flex-col gap-2">
        <div class="flex items-center px-1">
          <span class="chip" :class="col.tone" x-text="col.title + ' · ' + count(col)"></span>
        </div>
        <template x-for="t in ofCol(col)" :key="t.id">
          <div class="card p-3" :class="t.status === 'failed' ? 'border-danger/40' : ''">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold font-mono" x-text="t.seat_num + ' · ' + t.start + '–' + t.end"></span>
              <span class="chip" :class="toneOf(t)" x-text="t.status"></span>
            </div>
            <div class="text-xs text-ink-secondary" x-text="'账号 ' + t.account_id"></div>
            <template x-if="t.status === 'failed'">
              <div>
                <div class="text-xs text-danger mt-1 break-all" x-text="t.last_error || '未知原因'"></div>
                <form method="post" action="/tasks/quick-reserve" class="mt-2">
                  <input type="hidden" name="account_id" :value="t.account_id">
                  <input type="hidden" name="seat_num" :value="t.seat_num">
                  <input type="hidden" name="start" :value="t.start">
                  <input type="hidden" name="end" :value="t.end">
                  <button class="btn btn-danger btn-sm w-full justify-center" type="submit">重试</button>
                </form>
              </div>
            </template>
          </div>
        </template>
        <div x-show="count(col) === 0"
             class="text-xs text-ink-muted text-center py-6 border border-dashed border-edge-subtle rounded-xl">
          无
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}
